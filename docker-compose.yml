services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: "serverName=madkom"
      # Połączenie z PostgreSQL na hoście (np. kontener pg_import, port 5433).
      # Wartości domyślne = typowy lokalny pg_import; nadpisz w pliku .env obok compose.
      IMPORT_DB_HOST: "${IMPORT_DB_HOST:-host.docker.internal}"
      IMPORT_DB_PORT: "${IMPORT_DB_PORT:-5433}"
      IMPORT_DB_DATABASE: "${IMPORT_DB_DATABASE:-importdb}"
      IMPORT_DB_USERNAME: "${IMPORT_DB_USERNAME:-postgres}"
      IMPORT_DB_PASSWORD: "${IMPORT_DB_PASSWORD:-postgres}"
      XDEBUG_CLIENT_HOST: "${XDEBUG_CLIENT_HOST:-192.168.0.6}"
      XDEBUG_CLIENT_PORT: "${XDEBUG_CLIENT_PORT:-9004}"
      XDEBUG_IDEKEY: "${XDEBUG_IDEKEY:-PHPSTORM}"
      XDEBUG_CONFIG: "client_host=${XDEBUG_CLIENT_HOST:-192.168.0.6} client_port=${XDEBUG_CLIENT_PORT:-9004} idekey=${XDEBUG_IDEKEY:-PHPSTORM}"
    volumes:
      - .:/var/www/html
      - ../../chojnice:/var/www/files:ro
    networks:
      - laravel
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      laravel:
        aliases:
          - sidas-read-api
    depends_on:
      - app

  db:
    image: postgres:16
    shm_size: 1gb
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ezd_chojnice
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laravel

volumes:
  postgres_data:

networks:
  laravel:
    name: samo_shared
    driver: bridge
