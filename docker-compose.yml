services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Połączenie z PostgreSQL na hoście (np. kontener pg_import, port 5433).
      # Wartości domyślne = typowy lokalny pg_import; nadpisz w pliku .env obok compose.
      IMPORT_DB_HOST: "${IMPORT_DB_HOST:-host.docker.internal}"
      IMPORT_DB_PORT: "${IMPORT_DB_PORT:-5433}"
      IMPORT_DB_DATABASE: "${IMPORT_DB_DATABASE:-importdb}"
      IMPORT_DB_USERNAME: "${IMPORT_DB_USERNAME:-postgres}"
      IMPORT_DB_PASSWORD: "${IMPORT_DB_PASSWORD:-postgres}"
    volumes:
      - .:/var/www/html
    networks:
      - laravel
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laravel
    depends_on:
      - app

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ezd_chojnice
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laravel

volumes:
  postgres_data:

networks:
  laravel:
    driver: bridge
